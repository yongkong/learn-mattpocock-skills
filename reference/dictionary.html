<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 编码词典 · Dictionary</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/course.css">
<style>
  .toc { border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.4rem; background: #fff; }
  .toc ol { margin: 0.4rem 0 0.2rem; padding-left: 1.4rem; }
  .toc a { text-decoration: none; }
  .section { margin-top: 3rem; }
  .section > .back-top { float: right; font-size: 0.82rem; }
  .term-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr)); gap: 0.55rem; margin-top: 1.2rem; }
  .term-chip {
    text-align: left; padding: 0.5rem 0.8rem; cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px; background: #fff;
    font-family: inherit; font-size: 0.95rem; color: var(--ink); line-height: 1.4;
  }
  .term-chip:hover { border-color: var(--accent); }
  .term-chip .zh { display: block; color: var(--ink-soft); font-size: 0.8rem; }
  .attrib { margin-top: 4rem; }

  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(26, 26, 24, 0.45); display: flex; align-items: center; justify-content: center; padding: 0 1rem; }
  .overlay[hidden] { display: none; }
  .card {
    background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
    max-width: 56rem; width: 100%; height: 92vh;
    padding: 1.4rem 1.8rem 1.1rem;
    display: flex; flex-direction: column;
  }
  .card-head { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
  .card-head h2 { margin: 0; border: 0; padding: 0; font-size: 1.3rem; }
  .card-head h2 a { text-decoration: none; color: inherit; }
  .card-head .zh-name { color: var(--ink-soft); font-weight: 400; font-size: 1rem; }
  .card-close {
    margin-left: auto; flex: none; align-self: flex-start;
    border: 1px solid var(--line); border-radius: 999px; background: var(--paper);
    cursor: pointer; font-size: 0.85rem; padding: 0.15rem 0.7rem; color: var(--ink-soft);
  }
  .card-close:hover { border-color: var(--accent); color: var(--accent); }
  .card-meta { font-size: 0.85rem; color: var(--ink-soft); margin: 0.4rem 0 0; }
  .card-meta p { margin: 0.2rem 0; }
  .card-meta a { color: inherit; }
  .card-layout { display: flex; gap: 1.3rem; flex: 1; min-height: 0; margin-top: 0.8rem; }
  .card-body {
    flex: 1; min-width: 0; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent; /* Firefox */
  }
  .card-nav {
    flex: none; width: 12.5rem; position: relative;
    border-left: 1px solid var(--line); padding-left: 1rem;
    overflow-y: auto; font-size: 0.8rem; line-height: 1.5;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .card-nav .nav-sec {
    margin: 0.7rem 0 0.1rem; color: var(--ink-soft);
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .card-nav .nav-sec:first-child { margin-top: 0.2rem; }
  .card-nav button.nav-term {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: none; border: 0; padding: 0.1rem 0.35rem; margin: 0;
    font: inherit; color: var(--ink); border-radius: 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-nav button.nav-term:hover { background: var(--code-bg); color: var(--accent); }
  .card-nav button.nav-term.current { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  @media (max-width: 44rem) { .card-nav { display: none; } }
  .card-body::-webkit-scrollbar, .card-nav::-webkit-scrollbar { width: 10px; }
  .card-body::-webkit-scrollbar-track, .card-nav::-webkit-scrollbar-track { background: transparent; }
  .card-body::-webkit-scrollbar-thumb, .card-nav::-webkit-scrollbar-thumb {
    background: var(--line); background-clip: padding-box;
    border: 2px solid var(--paper); border-radius: 999px;
  }
  .card-body::-webkit-scrollbar-thumb:hover, .card-nav::-webkit-scrollbar-thumb:hover { background: #d6d3d1; background-clip: padding-box; }
  .card-body p { margin: 0.85rem 0; }
  .card-body ul, .card-body ol { margin: 0.85rem 0; padding-left: 1.5rem; }
  .card-body li { margin: 0.3rem 0; }
  .card-body h1, .card-body h2, .card-body h3 { font-size: 1.05rem; margin: 1.4rem 0 0.4rem; border: 0; padding: 0; }
  .card-foot { display: flex; align-items: center; gap: 0.8rem; margin-top: 1.2rem; padding-top: 0.8rem; border-top: 1px solid var(--line); }
  .card-foot button {
    font-family: inherit; font-size: 0.85rem; cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px; background: var(--paper);
    padding: 0.35rem 0.8rem; color: var(--ink);
  }
  .card-foot button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .card-foot button:disabled { opacity: 0.4; cursor: default; }
  .card-foot .pos { margin-left: auto; font-size: 0.8rem; color: var(--ink-soft); font-family: "Cascadia Code", Consolas, monospace; }
  .card-error { border-left: 3px solid var(--bad); background: var(--bad-soft); border-radius: 0 8px 8px 0; padding: 0.7rem 1rem; font-size: 0.9rem; }
  kbd.hint { font-size: 0.78rem; }
</style>
</head>
<body>
<main>
  <p class="kicker">Dictionary · 概念课程</p>
  <h1>AI 编码词典</h1>
  <p class="lede">一门相对独立的概念课程:AI 编码的核心术语,以自写中文转述、术语与例句保留英文。概念在这里查透,流程在课件里练。</p>
  <p class="cite">点开任意词条弹出卡片阅读;卡片内可用 <kbd class="hint">←</kbd> <kbd class="hint">→</kbd> 翻上一条 / 下一条,<kbd class="hint">Esc</kbd> 关闭。每条都有「原文 ↗」可对照源词条。</p>

  <nav class="toc" id="toc">
    <strong>目录</strong>
    <ol id="toc-list"></ol>
  </nav>

  <div id="sections"></div>

  <p class="attrib cite">来源:<a href="https://github.com/mattpocock/dictionary-of-ai-coding">mattpocock/dictionary-of-ai-coding</a> · <a href="https://aicodingdictionary.com">aicodingdictionary.com</a>。中文释义为自写转述,仅供个人学习;术语与 Usage 英文原文版权归原作者。</p>

  <p class="lesson-nav"><a href="../index.html">课程主页</a> · 配套课件:<a href="../lessons/0001-the-map.html">0001 · 全局地图</a></p>
</main>

<div class="overlay" id="overlay" hidden>
  <article class="card" role="dialog" aria-modal="true" aria-labelledby="card-title">
    <div class="card-head">
      <h2 id="card-title"></h2>
      <span class="zh-name" id="card-zh"></span>
      <button type="button" class="card-close" id="card-close">关闭 Esc</button>
    </div>
    <div class="card-meta" id="card-meta"></div>
    <div class="card-layout">
      <div class="card-body" id="card-body"></div>
      <nav class="card-nav" id="card-nav" aria-label="快速词条导航"></nav>
    </div>
    <div class="card-foot">
      <button type="button" id="card-prev">← <span id="card-prev-name"></span></button>
      <button type="button" id="card-next"><span id="card-next-name"></span> →</button>
      <span class="pos" id="card-pos"></span>
    </div>
  </article>
</div>

<script src="../assets/marked.min.js"></script>
<script>
(function () {
  "use strict";

  var MANIFEST = [
    { id: "the-model", zh: "模型本身", en: "The Model", terms: [
      { term: "AI", zh: "人工智能" },
      { term: "Model", zh: "模型" },
      { term: "Parameters", zh: "参数" },
      { term: "Training", zh: "训练" },
      { term: "Inference", zh: "推理" },
      { term: "Effort", zh: "思考力度" },
      { term: "Token", zh: "词元" },
      { term: "Next-token prediction", zh: "下一词元预测" },
      { term: "Non-determinism", zh: "非确定性" },
      { term: "Model provider", zh: "模型供应商" },
      { term: "Harness", zh: "挽具" },
      { term: "Model provider request", zh: "模型供应商请求" },
      { term: "Input tokens", zh: "输入词元" },
      { term: "Output tokens", zh: "输出词元" },
      { term: "Prefix cache", zh: "前缀缓存" },
      { term: "Cache tokens", zh: "缓存词元" }
    ] },
    { id: "sessions-context-windows-turns", zh: "会话、上下文窗口与轮次", en: "Sessions, Context Windows & Turns", terms: [
      { term: "Stateless", zh: "无状态" },
      { term: "Context", zh: "上下文" },
      { term: "Context window", zh: "上下文窗口" },
      { term: "Stateful", zh: "有状态" },
      { term: "Agent", zh: "智能体" },
      { term: "System prompt", zh: "系统提示词" },
      { term: "Session", zh: "会话" },
      { term: "Turn", zh: "轮次" }
    ] },
    { id: "tools-environment", zh: "工具与环境", en: "Tools & Environment", terms: [
      { term: "Environment", zh: "环境" },
      { term: "Filesystem", zh: "文件系统" },
      { term: "Tool", zh: "工具" },
      { term: "Tool call", zh: "工具调用" },
      { term: "Tool result", zh: "工具结果" },
      { term: "MCP", zh: "模型上下文协议" },
      { term: "Permission request", zh: "权限请求" },
      { term: "Permission mode", zh: "权限模式" },
      { term: "Agent mode", zh: "智能体模式" },
      { term: "Sandbox", zh: "沙箱" }
    ] },
    { id: "failure-modes", zh: "失效模式", en: "Failure Modes", terms: [
      { term: "Sycophancy", zh: "谄媚" },
      { term: "Hallucination", zh: "幻觉" },
      { term: "Parametric knowledge", zh: "参数化知识" },
      { term: "Knowledge cutoff", zh: "知识截止点" },
      { term: "Contextual knowledge", zh: "上下文知识" },
      { term: "Attention relationship", zh: "注意力关系" },
      { term: "Attention budget", zh: "注意力预算" },
      { term: "Attention degradation", zh: "注意力衰退" },
      { term: "Smart zone", zh: "聪明区" }
    ] },
    { id: "handoffs", zh: "交接", en: "Handoffs", terms: [
      { term: "Clearing", zh: "清空" },
      { term: "Handoff", zh: "交接" },
      { term: "Primary source", zh: "一手来源" },
      { term: "Secondary source", zh: "二手来源" },
      { term: "Handoff artifact", zh: "交接物" },
      { term: "Spec", zh: "规格" },
      { term: "Ticket", zh: "工单" },
      { term: "Compaction", zh: "压缩" },
      { term: "Autocompact", zh: "自动压缩" }
    ] },
    { id: "memory-and-steering", zh: "记忆与转向", en: "Memory and Steering", terms: [
      { term: "Memory system", zh: "记忆系统" },
      { term: "AGENTS.md", zh: "AGENTS.md 文件" },
      { term: "Progressive disclosure", zh: "渐进式披露" },
      { term: "Context pointer", zh: "上下文指针" },
      { term: "Skill", zh: "技能" },
      { term: "Subagent", zh: "子代理" }
    ] },
    { id: "patterns-of-work", zh: "工作模式", en: "Patterns of Work", terms: [
      { term: "Human-in-the-loop", zh: "人在环中" },
      { term: "AFK", zh: "挂机" },
      { term: "Automated check", zh: "自动化检查" },
      { term: "Automated review", zh: "自动化评审" },
      { term: "Human review", zh: "人工评审" },
      { term: "Vibe coding", zh: "氛围编程" },
      { term: "Design concept", zh: "设计概念" },
      { term: "Grilling", zh: "追问式访谈" },
      { term: "Prototyping", zh: "原型实验" },
      { term: "DX", zh: "开发者体验" },
      { term: "AX", zh: "智能体体验" }
    ] }
  ];

  // 扁平化:全簿顺序 = 节顺序 × 节内顺序,卡片的上/下一条按此序推进;文件名由术语名派生:<术语>.md
  var FLAT = [];
  MANIFEST.forEach(function (s) {
    s.terms.forEach(function (t) { FLAT.push({ sec: s, term: t, file: t.term + ".md" }); });
  });

  function slug(term) {
    return term.toLowerCase().replace(/\s+/g, "-");
  }

  function findBySlug(s) {
    for (var i = 0; i < FLAT.length; i++) {
      if (slug(FLAT[i].term.term) === s) return i;
    }
    return -1;
  }

  function setHash(hash) {
    try {
      history.replaceState(null, "", hash);
    } catch (e) { /* file:// 等场景下浏览器可能拒绝,静默降级 */ }
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function renderNav() {
    var toc = document.getElementById("toc-list");
    var host = document.getElementById("sections");
    var cardNav = document.getElementById("card-nav");

    MANIFEST.forEach(function (s) {
      var li = el("li");
      var a = el("a", null, s.zh + " · " + s.en);
      a.href = "#" + s.id;
      li.appendChild(a);
      li.appendChild(el("span", null, "(" + s.terms.length + " 条)"));
      toc.appendChild(li);

      var sec = el("section", "section");
      sec.id = s.id;
      var back = el("a", "back-top", "回顶部 ↑");
      back.href = "#toc";
      sec.appendChild(back);
      sec.appendChild(el("h2", null, s.zh + " · " + s.en));

      var grid = el("div", "term-grid");
      s.terms.forEach(function (t) {
        var btn = el("button", "term-chip");
        btn.type = "button";
        btn.dataset.slug = slug(t.term);
        btn.appendChild(el("strong", null, t.term));
        btn.appendChild(el("span", "zh", t.zh));
        grid.appendChild(btn);
      });
      sec.appendChild(grid);
      host.appendChild(sec);

      // 卡片右侧快速导航:节标题 + 词条两级
      cardNav.appendChild(el("div", "nav-sec", s.zh + " (" + s.terms.length + ")"));
      s.terms.forEach(function (t) {
        var nbtn = el("button", "nav-term", t.term);
        nbtn.type = "button";
        nbtn.dataset.slug = slug(t.term);
        nbtn.title = t.zh;
        cardNav.appendChild(nbtn);
      });
    });
  }

  var overlay = document.getElementById("overlay");
  var currentIdx = -1;
  var lastFocus = null;
  var loadSeq = 0; // 快速翻词时只让最后一次加载落笔

  function renderCard(entry) {
    var t = entry.term;
    var title = document.getElementById("card-title");
    title.textContent = "";
    var anchor = el("a", null, t.term);
    anchor.href = "#" + slug(t.term);
    title.appendChild(anchor);
    document.getElementById("card-zh").textContent = t.zh;
    document.getElementById("card-pos").textContent = "第 " + (currentIdx + 1) + " / " + FLAT.length + " 条";
    highlightNav(t.term);

    var prev = FLAT[currentIdx - 1];
    var next = FLAT[currentIdx + 1];
    document.getElementById("card-prev").disabled = !prev;
    document.getElementById("card-next").disabled = !next;
    document.getElementById("card-prev-name").textContent = prev ? prev.term.term : "";
    document.getElementById("card-next-name").textContent = next ? next.term.term : "";

    document.getElementById("card-meta").textContent = "";
    var body = document.getElementById("card-body");
    body.textContent = "";

    var seq = ++loadSeq;
    fetch("dictionary/" + encodeURIComponent(entry.file))
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function (text) {
        if (seq !== loadSeq || currentIdx < 0) return;
        paint(text);
      })
      .catch(function () {
        if (seq !== loadSeq || currentIdx < 0) return;
        var warn = el("div", "card-error");
        warn.textContent = "词条加载失败。若你是直接双击打开本页(file://),浏览器会拦截本地文件读取——请改用本地 HTTP 服务打开,例如在仓库根目录运行:python -m http.server";
        body.appendChild(warn);
      });

    function paint(text) {
      var lines = text.split("\n");
      var i = 0;
      if (i < lines.length && lines[i].charAt(0) === "#") i++; // H1 已由卡片头部呈现
      while (i < lines.length && lines[i].trim() === "") i++;
      var metaMd = [];
      while (i < lines.length && lines[i].trim() !== "" && lines[i].trim().charAt(0) === "[") {
        metaMd.push(lines[i].trim());
        i++;
      }
      while (i < lines.length && lines[i].trim() === "") i++;
      var bodyMd = lines.slice(i).join("\n");

      if (metaMd.length) {
        var meta = document.getElementById("card-meta");
        meta.innerHTML = marked.parse(metaMd.join(" · "));
      }
      body.innerHTML = marked.parse(bodyMd);
    }
  }

  function highlightNav(term) {
    var nav = document.getElementById("card-nav");
    var prev = nav.querySelector("button.nav-term.current");
    if (prev) prev.classList.remove("current");
    var btn = nav.querySelector('button.nav-term[data-slug="' + slug(term) + '"]');
    if (!btn) return;
    btn.classList.add("current");
    // 把当前词条滚进导航可视区(垂直居中附近);nav 是 position:relative,offsetTop 即相对导航
    nav.scrollTop = Math.max(0, btn.offsetTop - nav.clientHeight / 2);
  }

  function openTerm(idx, opts) {
    opts = opts || {};
    currentIdx = idx;
    if (!lastFocus) lastFocus = document.activeElement;
    renderCard(FLAT[idx]);
    overlay.hidden = false;
    document.body.style.overflow = "hidden";
    if (opts.updateHash !== false) {
      setHash("#" + slug(FLAT[idx].term.term));
    }
    document.getElementById("card-close").focus();
  }

  function closeCard(opts) {
    opts = opts || {};
    currentIdx = -1;
    loadSeq++;
    overlay.hidden = true;
    document.body.style.overflow = "";
    if (opts.updateHash !== false) {
      setHash(location.pathname + location.search);
    }
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    lastFocus = null;
  }

  function step(delta) {
    var idx = currentIdx + delta;
    if (idx < 0 || idx >= FLAT.length) return;
    openTerm(idx);
  }

  function init() {
    renderNav();

    document.getElementById("sections").addEventListener("click", function (ev) {
      var btn = ev.target.closest(".term-chip");
      if (!btn) return;
      var idx = findBySlug(btn.dataset.slug);
      if (idx >= 0) openTerm(idx);
    });

    document.getElementById("card-close").addEventListener("click", function () { closeCard(); });
    document.getElementById("card-prev").addEventListener("click", function () { step(-1); });
    document.getElementById("card-next").addEventListener("click", function () { step(1); });
    document.getElementById("card-nav").addEventListener("click", function (ev) {
      var btn = ev.target.closest("button.nav-term");
      if (!btn) return;
      var idx = findBySlug(btn.dataset.slug);
      if (idx >= 0) openTerm(idx);
    });
    overlay.addEventListener("click", function (ev) {
      if (ev.target === overlay) closeCard();
    });

    document.addEventListener("keydown", function (ev) {
      if (overlay.hidden) return;
      if (ev.key === "Escape") closeCard();
      else if (ev.key === "ArrowLeft") step(-1);
      else if (ev.key === "ArrowRight") step(1);
    });

    window.addEventListener("hashchange", function () {
      var idx = indexOfHash(location.hash);
      if (idx >= 0) openTerm(idx, { updateHash: false });
      else if (!overlay.hidden) closeCard({ updateHash: false });
    });

    // 深链:/reference/dictionary.html#context-window 直接弹出该词条
    var idx = indexOfHash(location.hash);
    if (idx >= 0) openTerm(idx, { updateHash: false });
  }

  function indexOfHash(hash) {
    if (!hash || hash.length < 2) return -1;
    return findBySlug(decodeURIComponent(hash.slice(1)));
  }

  init();
})();
</script>
</body>
</html>
